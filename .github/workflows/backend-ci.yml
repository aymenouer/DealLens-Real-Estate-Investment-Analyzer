
name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches: [master]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Backend/pom.xml

      - name: Build and run tests
        run: bash ./mvnw -B --no-transfer-progress clean verify
